<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTACT お問い合わせ | WEOON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<script>
  (function(d) {
    var config = {
      kitId: 'qao5euk',
      scriptTimeout: 3000,
      async: true
    },
    h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
  })(document);
</script>
<style>
:root{
  --page-pad-x: 100px;
  --page-pad-top: 100px;
  --page-pad-bottom: 120px;
  --header-gap: 100px;
  --col-text-w: 230px;
  --col-gap: 140px;
  --label-w: 140px;
  --field-gap: 20px;
  --row-gap: 20px;
  --input-h: 56px;
  --textarea-h: 261px;
  --checkbox-size: 18px;
  --agree-margin-top: 30px;
  --agree-margin-left: 160px;
  --submit-margin-top: 100px;
  --submit-h: 60px;
  --submit-w: 250px;
  --icon-size: 35px;
  --contact-x: 0px;
  --contact-y: 0px;
  --jp-x: 22px;
  --jp-y: -8px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
html{ width:100%; min-height:100vh; background:linear-gradient(150deg,#f4f6f8 0%,#e9edf1 55%,#dfe4e9 100%); }
body{ width:100%; min-height:100vh; background:transparent; overscroll-behavior:none; }
body{ font-family:"Noto Sans JP", sans-serif; color:#15171a; }
a{ color:inherit; }
::selection{ background:#0d0e10; color:#fff; }

/* =========================================================
   BACKGROUND DECORATION — full viewport, not clipped by content
========================================================= */
.bg-deco{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.bg-deco .deco-glow{
  content:""; position:absolute; left:-8%; top:-14%; width:34%; aspect-ratio:1/1; border-radius:50%;
  background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.18), rgba(255,255,255,0) 62%);
}
.bg-deco .deco-l1{
  position:absolute; left:0; top:0; width:220%; height:2px; background:rgba(30,35,42,.14);
  transform-origin:0 0; transform:rotate(24deg) translate(0, 190px);
}
.bg-deco .deco-l2{
  position:absolute; right:6%; bottom:8%; width:46%; height:1px; background:rgba(30,35,42,.14);
  transform-origin:100% 100%; transform:rotate(-42deg);
}

/* =========================================================
   PAGE WRAP
========================================================= */
main{ padding:var(--page-pad-top) var(--page-pad-x) var(--page-pad-bottom); display:block; position:relative; z-index:1; }

/* =========================================================
   CONTACT PANEL — matched to comp
========================================================= */
.contact-panel{
  position:relative;
  width:100%;
  padding:0 0 20px;
}

.cp-header{ position:relative; z-index:1; display:flex; align-items:baseline; gap:18px; margin-bottom:var(--header-gap); }
.cp-header .en{
  font-family:"ITC Avant Garde Gothic Pro","Century Gothic","Futura",sans-serif;
  font-weight:700; font-size:clamp(34px,4.5vw,60px); letter-spacing:-.01em; color:#0d0e10;
  transform:translate(var(--contact-x), var(--contact-y));
}
.cp-header .jp{
  font-family:"Noto Sans JP",sans-serif; font-weight:500; font-size:clamp(18px,2.2vw,30px); color:#1a1c1e;
  transform:translate(var(--jp-x), var(--jp-y));
}

.cp-body{ position:relative; z-index:1; display:grid; grid-template-columns:var(--col-text-w) 1fr; gap:var(--col-gap); }

.cp-text{
  font-weight:400; font-size:16px; line-height:36px; letter-spacing:.02em; color:#33383e;
  padding-top:4px; white-space:nowrap;
}

.cp-form{ width:100%; transform:translateX(15px); }
.field{
  display:flex; align-items:center; gap:var(--field-gap); margin-bottom:var(--row-gap);
}
.field.area{ align-items:flex-start; }
.field label{
  flex:0 0 var(--label-w); text-align:right;
  font-weight:400; font-size:15px; letter-spacing:.02em; color:#20252b;
  padding-top:0;
}
.field.area label{ padding-top:12px; }
.field label .req{ color:#e25b5b; margin-left:2px; }
.field .control{ flex:1 1 auto; }

input[type="text"], input[type="email"], select{
  width:100%; height:var(--input-h); border:1px solid #c9ced3; border-radius:5px; background:#fbfbfc;
  padding:0 14px; font-family:"Noto Sans JP",sans-serif; font-weight:400; font-size:20px; color:#15171a;
  transition:border-color .2s ease, background .2s ease;
}
textarea{
  width:100%; border:1px solid #c9ced3; border-radius:5px; background:#fbfbfc;
  padding:14px; font-family:"Noto Sans JP",sans-serif; font-weight:400; font-size:20px; color:#15171a;
  transition:border-color .2s ease, background .2s ease;
}
input::placeholder, textarea::placeholder{ color:#aeb3b8; font-weight:300; }
input:focus, select:focus, textarea:focus{ outline:none; border-color:#8a929a; background:#fff; }
textarea{ resize:vertical; height:var(--textarea-h); line-height:1.8; }
select{
  appearance:none; -webkit-appearance:none; cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%2320252b' stroke-width='1.4' fill='none' fill-rule='evenodd'/></svg>");
  background-repeat:no-repeat; background-position:right 16px center;
}
select:invalid{ color:#aeb3b8; }

.field.invalid input, .field.invalid select, .field.invalid textarea{ border-color:#c65b5b; background:#fff7f6; }
.field .err{ display:none; margin-top:6px; font-size:11.5px; color:#c65b5b; }
.field.invalid .err{ display:block; }

.cp-agree{
  display:flex; align-items:center; gap:9px; margin:var(--agree-margin-top) 0 0 var(--agree-margin-left); cursor:pointer;
  font-weight:400; font-size:16px; color:#20252b;
}
.cp-agree input{ width:var(--checkbox-size); height:var(--checkbox-size); accent-color:#20252b; }

.cp-submit-row{ display:flex; justify-content:center; margin-top:var(--submit-margin-top); }
.submit-btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  width:var(--submit-w); height:var(--submit-h); border:1px solid #c9ced3; cursor:pointer;
  background:#fff; border-radius:999px; padding:0 66px 0 34px;
  font-family:"Noto Sans JP",sans-serif; font-weight:500; font-size:25px; letter-spacing:.28em; color:#15171a;
  transition:border-color .2s ease, transform .2s ease;
}
.submit-btn:hover{ border-color:#8a929a; transform:translateY(-1px); }
.submit-btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; }
.submit-btn .icon{
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  width:var(--icon-size); height:var(--icon-size); border-radius:50%; background:#2f6fed;
  display:flex; align-items:center; justify-content:center;
}
.submit-btn .icon svg{ width:14px; height:14px; }

.cp-thanks{ display:none; text-align:center; padding:60px 0; }
.cp-thanks.show{ display:block; }
.cp-thanks .ok-mark{
  width:48px; height:48px; border-radius:50%; background:#0d0e10; color:#fff;
  display:flex; align-items:center; justify-content:center; margin:0 auto 22px;
}
.cp-thanks .ok-mark svg{ width:20px; height:20px; }
.cp-thanks h2{
  font-family:"ITC Avant Garde Gothic Pro","Century Gothic","Futura",sans-serif;
  font-weight:700; font-size:22px; margin-bottom:14px; color:#0d0e10;
}
.cp-thanks p{ font-weight:400; font-size:13.5px; line-height:2; color:#4a4f56; }
#contactForm.hidden{ display:none; }

@media (max-width:900px){
  main{ padding:70px 6% 90px; }
  .contact-panel{ padding:0 0 20px; }
  .cp-body{ grid-template-columns:1fr; gap:8px; }
  .cp-text{ margin-bottom:36px; }
  .field{ flex-direction:column; align-items:flex-start; gap:8px; }
  .field label{ text-align:left; flex:none; padding-top:0!important; }
  .cp-agree{ margin-left:0; }
  .field.area label{ padding-top:0; }
}
@media (max-width:520px){
  main{ padding:60px 5% 80px; }
  .cp-header{ flex-direction:column; gap:6px; align-items:flex-start; }
  .submit-btn{ width:100%; }
  .cp-text{ white-space:normal; }
}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>


<div class="bg-deco">
  <div class="deco-glow"></div>
  <div class="deco-l1"></div>
  <div class="deco-l2"></div>
</div>

<main>
  <div class="contact-panel">

    <div class="cp-header">
      <span class="en">CONTACT</span>
      <span class="jp">お問い合わせ</span>
    </div>

    <form id="contactForm" novalidate>
    <div class="cp-body">
      <div class="cp-text">
        弊社のお問い合わせフォームです。<br>
        いただいた内容を確認のうえ、<br>
        担当者からご連絡差し上げます。<br>
        なお入力いただいた個人情報は<br>
        プライバシーポリシーにのっとり、<br>
        厳重に管理いたします。
      </div>

      <div class="cp-form">
          <div class="field" data-field="company">
            <label for="company">会社名／所属団体<span class="req">*</span></label>
            <div class="control">
              <input type="text" id="company" name="company" required>
              <div class="err">会社名／所属団体を入力してください。</div>
            </div>
          </div>

          <div class="field" data-field="dept">
            <label for="dept">部署</label>
            <div class="control">
              <input type="text" id="dept" name="dept">
            </div>
          </div>

          <div class="field" data-field="name">
            <label for="name">氏名<span class="req">*</span></label>
            <div class="control">
              <input type="text" id="name" name="name" required>
              <div class="err">氏名を入力してください。</div>
            </div>
          </div>

          <div class="field" data-field="email">
            <label for="email">メールアドレス<span class="req">*</span></label>
            <div class="control">
              <input type="email" id="email" name="email" required>
              <div class="err">正しいメールアドレスを入力してください。</div>
            </div>
          </div>

          <div class="field" data-field="type">
            <label for="type">お問い合わせ種別<span class="req">*</span></label>
            <div class="control">
              <select id="type" name="type" required>
                <option value="" disabled selected>選択してください</option>
                <option>サービス全般について</option>
                <option>YALO経営診断について</option>
                <option>お見積もり・ご相談</option>
                <option>資料請求</option>
                <option>取材・提携のご相談</option>
                <option>採用について</option>
                <option>その他</option>
              </select>
              <div class="err">お問い合わせ種別を選択してください。</div>
            </div>
          </div>

          <div class="field area" data-field="message">
            <label for="message">お問い合わせ内容<span class="req">*</span></label>
            <div class="control">
              <textarea id="message" name="message" rows="6" required></textarea>
              <div class="err">お問い合わせ内容を入力してください。</div>
            </div>
          </div>

          <label class="cp-agree">
            <input type="checkbox" id="agree" name="agree" required>
            <span>プライバシーポリシーに同意する</span>
          </label>
        </div>
      </div>

      <div class="cp-submit-row">
        <button type="submit" class="submit-btn" id="submitBtn">
          <span>送　信</span>
          <span class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
      </div>
    </form>

    <div class="cp-thanks" id="thanksMsg">
      <div class="ok-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2>お問い合わせありがとうございます</h2>
      <p>内容を確認の上、担当者よりご連絡いたします。<br>今しばらくお待ちください。</p>
    </div>
  </div>
</main>

<script>
// GSAP entrance animation — same fade + slide-in stagger approach as the diagnosis page.
// Guarded so the page still works fine if GSAP fails to load.
(function(){
  if (typeof gsap === 'undefined') return;
  gsap.registerPlugin(ScrollTrigger);

  // heading is visible immediately on load, so animate right away (no scroll trigger)
  var headTl = gsap.timeline({ defaults:{ ease:'power2.out', duration:.7 } });
  headTl
    .from('.cp-header .en', { opacity:0, y:26 })
    .from('.cp-header .jp', { opacity:0, y:26 }, '-=0.45');

  // paragraph text, revealed on scroll
  gsap.from('.cp-text', {
    opacity:0, y:24, duration:.7, ease:'power2.out',
    scrollTrigger:{ trigger:'.cp-text', start:'top 90%' }
  });

  // each form field row, staggered in as the form scrolls into view
  gsap.from('.cp-form .field', {
    opacity:0, y:20, duration:.6, ease:'power2.out', stagger:0.08,
    scrollTrigger:{ trigger:'.cp-form', start:'top 85%' }
  });

  // checkbox row
  gsap.from('.cp-agree', {
    opacity:0, y:16, duration:.6, ease:'power2.out',
    scrollTrigger:{ trigger:'.cp-agree', start:'top 92%' }
  });

  // submit button
  gsap.from('.cp-submit-row', {
    opacity:0, y:16, duration:.6, ease:'power2.out',
    scrollTrigger:{ trigger:'.cp-submit-row', start:'top 95%' }
  });

  // slow, subtle ambient motion for the background geometry — respects reduced-motion
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    gsap.to('.deco-glow', {
      x: 40, y: 30, scale: 1.08, duration: 22, ease: 'sine.inOut',
      repeat: -1, yoyo: true
    });
    gsap.to('.deco-l1', {
      rotate: 27, x: '+=2%', duration: 26, ease: 'sine.inOut',
      repeat: -1, yoyo: true
    });
    gsap.to('.deco-l2', {
      rotate: -38, duration: 30, ease: 'sine.inOut',
      repeat: -1, yoyo: true
    });
  }
})();
</script>

<script>
(function(){
  var form = document.getElementById('contactForm');
  var thanks = document.getElementById('thanksMsg');
  var submitBtn = document.getElementById('submitBtn');

  function setError(fieldEl, invalid){ fieldEl.classList.toggle('invalid', invalid); }

  function validate(){
    var ok = true;
    form.querySelectorAll('[required]').forEach(function(input){
      var fieldEl = input.closest('.field');
      var valid = input.type === 'checkbox' ? input.checked : input.value.trim() !== '';
      if(input.type === 'email' && valid){
        valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim());
      }
      if(fieldEl) setError(fieldEl, !valid);
      if(!valid) ok = false;
    });
    return ok;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(!validate()){
      var firstInvalid = form.querySelector('.invalid input, .invalid select, .invalid textarea');
      if(firstInvalid) firstInvalid.focus();
      return;
    }
    submitBtn.disabled = true;
    submitBtn.querySelector('span').textContent = '送信中...';

    // NOTE: no backend is wired up yet — replace this timeout with an
    // actual fetch() call to your form endpoint when one is ready.
    setTimeout(function(){
      form.classList.add('hidden');
      thanks.classList.add('show');
    }, 500);
  });

  form.querySelectorAll('input, select, textarea').forEach(function(input){
    input.addEventListener('input', function(){
      var fieldEl = input.closest('.field');
      if(fieldEl) setError(fieldEl, false);
    });
  });
})();
</script>
</body>
</html>
